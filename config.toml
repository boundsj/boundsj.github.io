baseURL = 'https://www.bounds.dev/'

# Change the default theme to be use when building the site with Hugo
theme = 'bounds-ascii'

# website title
title = 'bounds.dev'

# language code ["en", "zh-CN", "fr", "pl", ...]
languageCode = 'en-us'
# language name ["English", "简体中文", "Français", "Polski", ...]
languageName = "English"

# Author config
[author]
  name = "Jesse Bounds"
  email = "jesse@rebounds.net"

# Markup related configuration in Hugo
[markup]
  # Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
  [markup.highlight]
    # false is a necessary configuration (https://github.com/dillonzq/LoveIt/issues/158)
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

# copyright description used only for seo schema
#copyright = ""

# These three flags remain in the current nested table pending a separate review.
# whether to use robots.txt
enableRobotsTXT = true
# whether to use git commit log
enableGitInfo = true
# whether to use emoji code
enableEmoji = true

# default amount of posts in each pages
[pagination]
  pagerSize = 12

# Menu config
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    # you can add extra information before the name (HTML format is supported), such as icons
    pre = ""
    # you can add extra information after the name (HTML format is supported), such as icons
    post = ""
    name = "Posts"
    url = "/posts/"
    # title will be shown when you hover on this menu link
    title = ""
  [[menu.main]]
    weight = 2
    identifier = "tags"
    pre = ""
    post = ""
    name = "Tags"
    url = "/tags/"
    title = ""
  [[menu.main]]
    weight = 3
    identifier = "categories"
    pre = ""
    post = ""
    name = "Categories"
    url = "/categories/"
    title = ""
  [[menu.main]]
    weight = 4
    identifier = "about"
    pre = ""
    post = ""
    name = "About"
    url = "/about/"
    title = ""

[params]
  # Website metadata used by the active theme.
  title = "bounds.dev"
  description = "Portfolio, blog, photos, and assorted works of Jesse Bounds"
  images = ["/social-default.png"]

  [params.author]
    name = "Jesse Bounds"
    email = "jesse@rebounds.net"
    link = "/"

  [params.footer]
    since = 2019
    license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  [params.home.profile]
    title = "Jesse Bounds"
    subtitle = "One person and some bots are typing"

  [params.page.mapbox]
    accessToken = "pk.eyJ1IjoiYm91bmRzaiIsImEiOiJjbGV2cGc3ZWcwMGZwM3lwbzVjNm1xdm9zIn0.rkEbKnCxdu87aJCXIxNmUw"
    lightStyle = "mapbox://styles/mapbox/light-v10?optimize=true"
    darkStyle = "mapbox://styles/mapbox/dark-v10?optimize=true"
    navigation = true
    geolocate = false
    scale = true
    fullscreen = false

  [params.analytics]
    enable = true
    [params.analytics.google]
      id = "G-LT0HKHY2J5"
      anonymizeIP = true
