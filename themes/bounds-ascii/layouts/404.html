{{ define "main" }}
<div class="kc-archive kc-404" data-ui="404">
  <h1 class="kc-pagetitle"><span class="kc-prompt" aria-hidden="true">$</span> 404: page not found</h1>
  <pre class="kc-404__shell" aria-hidden="true"><span class="kc-prompt">$</span> cd <span data-404-path>this-page</span>
bash: cd: <span data-404-path>this-page</span>: No such file or directory</pre>
  <p class="kc-lede">That page doesn't exist, or it moved. Try one of these:</p>
  <div class="kc-404__actions">
    <a class="kc-btn" href="{{ "/writing/" | relURL }}" data-nav="writing">~/writing</a>
    <a class="kc-btn" href="{{ "/photos/" | relURL }}" data-nav="photos">~/photos</a>
    <a class="kc-btn" href="{{ "/" | relURL }}" data-nav="home">home</a>
  </div>
</div>
{{ end }}
