{{- /* A terminal listing row with the article title, date, and read time. */ -}}
<a class="kc-row" href="{{ .RelPermalink }}" title="{{ .Title }}" aria-label="{{ .Title }} — {{ .Date.Format "2006-01-02" }}, {{ .ReadingTime }} min read">
  <span class="kc-row__glyph" aria-hidden="true">›</span>
  <time class="kc-row__date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
  <span class="kc-row__readtime">{{ .ReadingTime }} min</span>
  <span class="kc-row__title">{{ .Title }}</span>
</a>
