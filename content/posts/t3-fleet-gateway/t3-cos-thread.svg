<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="title desc">
  <title id="title">A simplified T3 Code window showing the Crumb Exchange Chief of Staff thread receiving a message sent by another agent</title>
  <desc id="desc">A dark desktop app. The sidebar lists threads grouped by fictional project, with Crumb Exchange CoS highlighted and working. The main pane shows a changed files summary, an incoming instruction labeled Sent by another agent asking for a resting orders panel, a working indicator, and a composer with the Claude Opus 5.5 model chip and full access.</desc>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .t { fill: #e6e6ea; }
    .m { fill: #8b8b94; }
    .d { fill: #c9c9d0; }
    .add { fill: #4fc47a; }
    .del { fill: #e0596a; }
    .blue { fill: #5b9bf0; }
    .proj { font-size: 11px; fill: #8b8b94; }
    .thr { font-size: 12px; fill: #e6e6ea; }
    .body { font-size: 12px; fill: #e6e6ea; }
    .small { font-size: 10.5px; }
    .chip { font-size: 10px; font-weight: 700; fill: #fff; }
  </style>
  <defs>
    <clipPath id="frame"><rect width="760" height="500" rx="14"/></clipPath>
  </defs>
  <rect width="760" height="500" rx="14" fill="#0d0d11"/>
  <g clip-path="url(#frame)" class="ui">
    <!-- Sidebar -->
    <rect width="196" height="500" fill="#121217"/>
    <path d="M196 0V500" stroke="#24242c"/>
    <rect x="12" y="12" width="14" height="14" rx="3" fill="none" stroke="#9a9aa6" stroke-width="1.4"/>
    <path d="M17 12v14M12 19h14" stroke="#9a9aa6" stroke-width="1.2"/>
    <text x="34" y="23" font-size="13" font-weight="700" class="t">T3 Code</text>

    <!-- search -->
    <rect x="12" y="38" width="172" height="24" rx="6" fill="#1a1a21"/>
    <circle cx="26" cy="50" r="4" fill="none" stroke="#8b8b94" stroke-width="1.4"/>
    <path d="M29 53l3 3" stroke="#8b8b94" stroke-width="1.4" stroke-linecap="round"/>
    <text x="38" y="54" font-size="11.5" class="m">Search</text>

    <!-- selected thread: crumb-exchange / Crumb Exchange CoS -->
    <rect x="8" y="74" width="180" height="60" rx="8" fill="#1d1d26"/>
    <rect x="14" y="81" width="16" height="14" rx="3" fill="#2e3a55"/>
    <text x="22" y="91.5" text-anchor="middle" font-size="8" font-weight="700" fill="#9fc0ff">CE</text>
    <text x="36" y="92" class="proj mono">crumb-exchange</text>
    <text x="14" y="111" font-size="12.5" font-weight="600" class="t">Crumb Exchange CoS</text>
    <text x="14" y="127" font-size="10.5" class="m">main</text>
    <circle cx="113" cy="123" r="4.5" fill="none" stroke="#5b9bf0" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="184" y="127" text-anchor="end" font-size="10.5" class="blue">Working 34s</text>

    <!-- other threads -->
    <g transform="translate(0 144)">
      <rect x="14" y="7" width="16" height="14" rx="3" fill="#3a2e55"/>
      <text x="22" y="17.5" text-anchor="middle" font-size="8" font-weight="700" fill="#d2bfff">SM</text>
      <text x="36" y="18" class="proj mono">sock-matcher</text>
      <text x="184" y="18" text-anchor="end" font-size="10.5" class="m">Waiting</text>
      <text x="14" y="37" class="thr">Sock Matcher CoS</text>
    </g>
    <g transform="translate(0 194)">
      <rect x="14" y="7" width="16" height="14" rx="3" fill="#4a3a1e"/>
      <text x="22" y="17.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffd79a">GO</text>
      <text x="36" y="18" class="proj mono">gerbil-ops</text>
      <text x="184" y="18" text-anchor="end" font-size="10.5" class="m">2h</text>
      <text x="14" y="37" class="thr">Gerbil Ops CoS</text>
    </g>
    <g transform="translate(0 244)">
      <rect x="14" y="7" width="16" height="14" rx="3" fill="#1e4a3a"/>
      <text x="22" y="17.5" text-anchor="middle" font-size="8" font-weight="700" fill="#9affd0">BT</text>
      <text x="36" y="18" class="proj mono">bagel-telemetry</text>
      <text x="184" y="18" text-anchor="end" font-size="10.5" class="m">Waiting</text>
      <text x="14" y="37" class="thr">Bagel Telemetry CoS</text>
    </g>
    <g transform="translate(0 294)">
      <rect x="14" y="7" width="16" height="14" rx="3" fill="#4a1e2e"/>
      <text x="22" y="17.5" text-anchor="middle" font-size="8" font-weight="700" fill="#ffb3c8">MD</text>
      <text x="36" y="18" class="proj mono">meeting-dodger</text>
      <text x="184" y="18" text-anchor="end" font-size="10.5" class="m">3d</text>
      <text x="14" y="37" class="thr">Meeting Dodger CoS</text>
    </g>

    <!-- snoozed -->
    <text x="14" y="368" font-size="11" fill="#4f8ad8">Snoozed</text>
    <path d="M68 364H170" stroke="#2a2a35"/>
    <text x="184" y="368" text-anchor="end" font-size="10" fill="#4f8ad8">⌃</text>
    <g font-size="11.5" class="m">
      <text x="14" y="392">Lunch Ledger CoS</text>
      <text x="184" y="392" text-anchor="end">5d</text>
      <text x="14" y="414">Dad Joke Desk</text>
      <text x="184" y="414" text-anchor="end">10d</text>
    </g>
    <text x="14" y="444" font-size="11" class="m">Settled (38)</text>
    <path d="M86 440H170" stroke="#2a2a35"/>
    <text x="184" y="444" text-anchor="end" font-size="10" class="m">⌄</text>
    <g fill="none" stroke="#6a6a76" stroke-width="1.4" stroke-linecap="round">
      <circle cx="20" cy="480" r="4.5"/>
      <path d="M44 475v10M50 475v10M44 480a3 3 0 0 0 6 0"/>
      <path d="M72 485v-6M78 485v-10M84 485v-4"/>
    </g>

    <!-- Main pane -->
    <!-- breadcrumb -->
    <rect x="210" y="12" width="16" height="14" rx="3" fill="#2e3a55"/>
    <text x="218" y="22.5" text-anchor="middle" font-size="8" font-weight="700" fill="#9fc0ff">CE</text>
    <text x="232" y="23" font-size="12" class="m mono">crumb-exchange</text>
    <text x="342" y="23" font-size="12" class="m">/</text>
    <text x="352" y="23" font-size="12" class="t">Crumb Exchange CoS</text>
    <g fill="none" stroke="#8b8b94" stroke-width="1.3">
      <rect x="598" y="12" width="12" height="12" rx="2"/><path d="M601 16h6M601 19h4"/>
      <rect x="620" y="12" width="12" height="12" rx="2"/><path d="M620 19h12"/>
      <rect x="642" y="12" width="12" height="12" rx="2"/><path d="M650 12v12"/>
    </g>

    <!-- changed files card -->
    <rect x="210" y="40" width="384" height="112" rx="10" fill="#15151b" stroke="#24242c"/>
    <text x="226" y="62" font-size="11.5" class="t">6 changed files <tspan class="add mono">+412</tspan> <tspan class="del mono">-37</tspan></text>
    <text x="578" y="62" text-anchor="end" font-size="11" class="m">⎘ Open diff</text>
    <g class="mono" font-size="11">
      <text x="230" y="86" class="m">▸ ▭ src</text>
      <text x="548" y="86" text-anchor="end" class="add">+296</text>
      <text x="578" y="86" text-anchor="end" class="del">-31</text>
      <text x="230" y="106" class="m">▸ ▭ test</text>
      <text x="548" y="106" text-anchor="end" class="add">+104</text>
      <text x="578" y="106" text-anchor="end" class="del">-6</text>
      <text x="230" y="126" class="m">   ▤ README.md</text>
      <text x="548" y="126" text-anchor="end" class="add">+12</text>
      <text x="578" y="126" text-anchor="end" class="del">-0</text>
      <text x="230" y="146" class="m">   ▤ CHANGELOG.md</text>
      <text x="548" y="146" text-anchor="end" class="add">+8</text>
      <text x="578" y="146" text-anchor="end" class="del">-0</text>
    </g>

    <!-- incoming message -->
    <text x="594" y="190" text-anchor="end" font-size="10.5" class="m">Sent by another agent</text>
    <rect x="256" y="198" width="338" height="118" rx="12" fill="#1e1e26"/>
    <text x="272" y="222" class="body">Add a resting orders panel to Crumb Exchange:</text>
    <text x="272" y="240" class="body">list open orders, let the user cancel one, and</text>
    <text x="272" y="258" class="body">keep the existing order ticket as it is. Have</text>
    <text x="272" y="276" class="body">Fable review the change before you report</text>
    <text x="272" y="294" class="body">back here with a short summary.</text>
    <text x="578" y="310" text-anchor="end" font-size="10.5" class="m">Show full message</text>

    <!-- working + thought -->
    <text x="210" y="346" font-size="12" class="m">Working for 34s</text>
    <circle cx="217" cy="370" r="5" fill="none" stroke="#6a6a76" stroke-width="1.3"/>
    <path d="M214 370h6M217 367v6" stroke="#6a6a76" stroke-width="1" />
    <text x="230" y="374" font-size="11.5" class="m">Opus has the panel; handing the diff to Fable for review…</text>

    <!-- composer -->
    <rect x="210" y="392" width="384" height="92" rx="12" fill="#15151b" stroke="#2a2a35"/>
    <text x="226" y="416" font-size="11.5" class="m">Ask anything, @tag files, $use skills, or / for commands</text>
    <path d="M224 406v12" stroke="#c9c9d0" stroke-width="1.2"/>
    <path d="M232 457l1.6 3.9 3.9 1.6-3.9 1.6-1.6 3.9-1.6-3.9-3.9-1.6 3.9-1.6z" fill="#e07a55"/>
    <text x="243" y="467" font-size="11.5" class="t">Claude Opus 5.5 <tspan class="m">⌄</tspan></text>
    <path d="M352 455v16" stroke="#2a2a35"/>
    <text x="362" y="467" font-size="11.5" class="t">High <tspan class="m">⌄</tspan></text>
    <path d="M404 455v16" stroke="#2a2a35"/>
    <rect x="414" y="461" width="8" height="6" rx="1" fill="none" stroke="#c9c9d0" stroke-width="1.2"/>
    <path d="M415.5 461v-2a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="#c9c9d0" stroke-width="1.2"/>
    <text x="428" y="467" font-size="11.5" class="t">Full access <tspan class="m">⌄</tspan></text>
    <path d="M552 459l-6 6a3 3 0 0 0 4 4l7-7a5 5 0 0 0-7-7l-7 7" fill="none" stroke="#8b8b94" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="576" cy="463" r="11" fill="#e0596a"/>
    <rect x="572" y="459" width="8" height="8" rx="1.5" fill="#fff"/>

    <!-- right panel -->
    <path d="M608 0V500" stroke="#24242c"/>
    <rect x="618" y="40" width="130" height="92" rx="10" fill="#15151b" stroke="#24242c"/>
    <g font-size="11" class="t">
      <rect x="630" y="52" width="12" height="7" rx="2" fill="none" stroke="#8b8b94" stroke-width="1.2"/>
      <text x="650" y="60">Mac mini</text>
      <path d="M630 72h4l1.5 2H642v6H630z" fill="none" stroke="#8b8b94" stroke-width="1.2"/>
      <text x="650" y="80" class="mono" font-size="10.5">crumb-exchange</text>
      <rect x="631" y="92" width="10" height="10" rx="2" fill="none" stroke="#8b8b94" stroke-width="1.2"/>
      <text x="650" y="100">Open in editor</text>
      <path d="M632 117h8M636 113v8" stroke="#8b8b94" stroke-width="1.2"/>
      <text x="650" y="120">Add script</text>
    </g>
    <rect x="618" y="144" width="130" height="72" rx="10" fill="#15151b" stroke="#24242c"/>
    <g font-size="11" class="t">
      <circle cx="634" cy="158" r="2.5" fill="none" stroke="#8b8b94" stroke-width="1.2"/>
      <circle cx="634" cy="170" r="2.5" fill="none" stroke="#8b8b94" stroke-width="1.2"/>
      <path d="M634 160.5v7" stroke="#8b8b94" stroke-width="1.2"/>
      <text x="650" y="168" class="mono" font-size="10.5">main</text>
      <path d="M630 190l3-3 3 3M633 187v8" fill="none" stroke="#8b8b94" stroke-width="1.2"/>
      <text x="650" y="192">Publish</text>
      <text x="650" y="208">Diff</text>
      <text x="740" y="208" text-anchor="end" font-size="10" class="mono"><tspan class="add">+412</tspan> <tspan class="del">-37</tspan></text>
    </g>
  </g>
</svg>
