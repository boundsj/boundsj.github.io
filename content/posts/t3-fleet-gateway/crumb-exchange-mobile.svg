<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" role="img" aria-labelledby="title desc">
  <title id="title">A mobile mock of Crumb Exchange, a fictional play-money prediction market for sandwich questions, with its new Resting orders panel</title>
  <desc id="desc">A dark phone-sized trading view. The header shows a balance of 1,000 crumbs. The selected market Is a hot dog a sandwich shows bid and ask in crumbs, a YES/NO and BUY/SELL ticket, a new Resting orders panel with a Cancel button, and a short list of other sandwich markets.</desc>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .t { fill: #e8edf3; }
    .m { fill: #8d99a8; }
    .g { fill: #3fcf7f; }
    .r { fill: #ef6b6b; }
    .lbl { font-size: 10.5px; fill: #8d99a8; }
  </style>
  <defs>
    <clipPath id="frame"><rect width="360" height="640" rx="16"/></clipPath>
  </defs>
  <rect width="360" height="640" rx="16" fill="#0f141b"/>
  <g clip-path="url(#frame)" class="ui">
    <!-- header -->
    <rect width="360" height="48" fill="#121920"/>
    <path d="M0 48H360" stroke="#243040"/>
    <text x="16" y="30" font-size="15" font-weight="700" class="t">Crumb Exchange</text>
    <circle cx="150" cy="25" r="3.5" fill="#3fcf7f"/>
    <text x="344" y="23" text-anchor="end" font-size="10" class="m">Balance</text>
    <text x="344" y="38" text-anchor="end" font-size="12.5" font-weight="700" class="t">1,000 crumbs</text>

    <!-- market detail -->
    <text x="16" y="72" font-size="10.5" class="m">Sandwiches · open question</text>
    <text x="16" y="94" font-size="17" font-weight="700" class="t">Is a hot dog a sandwich?</text>
    <rect x="16" y="104" width="48" height="17" rx="3" fill="none" stroke="#3a4a60"/>
    <text x="40" y="116" text-anchor="middle" font-size="9" class="m">ACTIVE</text>
    <circle cx="76" cy="112" r="3" fill="#3fcf7f"/><text x="83" y="116" font-size="10.5" class="g">live</text>
    <text x="344" y="116" text-anchor="end" font-size="10.5" class="m">vol 92</text>

    <g font-size="10" class="m">
      <rect x="16" y="132" width="76" height="44" rx="6" fill="#141c25" stroke="#243040"/><text x="26" y="148">Last</text><text x="26" y="168" class="mono t" font-size="15">21c</text>
      <rect x="100" y="132" width="76" height="44" rx="6" fill="#141c25" stroke="#243040"/><text x="110" y="148">Yes bid</text><text x="110" y="168" class="mono g" font-size="15">20c</text>
      <rect x="184" y="132" width="76" height="44" rx="6" fill="#141c25" stroke="#243040"/><text x="194" y="148">Yes ask</text><text x="194" y="168" class="mono r" font-size="15">21c</text>
      <rect x="268" y="132" width="76" height="44" rx="6" fill="#141c25" stroke="#243040"/><text x="278" y="148">Spread</text><text x="278" y="168" class="mono t" font-size="15">1c</text>
    </g>

    <!-- ticket -->
    <rect x="16" y="190" width="160" height="30" rx="5" fill="#1b4a35" stroke="#3fcf7f"/><text x="96" y="209.5" text-anchor="middle" font-size="12" font-weight="700" class="g">YES</text>
    <rect x="184" y="190" width="160" height="30" rx="5" fill="#141c25" stroke="#2b3645"/><text x="264" y="209.5" text-anchor="middle" font-size="12" font-weight="700" class="t">NO</text>
    <rect x="16" y="228" width="160" height="30" rx="5" fill="#1b2a40" stroke="#3a5a86"/><text x="96" y="247.5" text-anchor="middle" font-size="12" font-weight="700" fill="#9fc0ff">BUY</text>
    <rect x="184" y="228" width="160" height="30" rx="5" fill="#141c25" stroke="#2b3645"/><text x="264" y="247.5" text-anchor="middle" font-size="12" font-weight="700" class="t">SELL</text>

    <text x="16" y="280" class="lbl">Price (crumbs)</text>
    <rect x="16" y="286" width="30" height="28" rx="5" fill="#1a222c" stroke="#2b3645"/><text x="31" y="305" text-anchor="middle" font-size="13" class="t">–</text>
    <rect x="52" y="286" width="88" height="28" rx="5" fill="#1a222c" stroke="#2b3645"/><text x="96" y="305" text-anchor="middle" font-size="13" class="mono t">20</text>
    <rect x="146" y="286" width="30" height="28" rx="5" fill="#1a222c" stroke="#2b3645"/><text x="161" y="305" text-anchor="middle" font-size="13" class="t">+</text>
    <text x="184" y="280" class="lbl">Contracts</text>
    <rect x="184" y="286" width="160" height="28" rx="5" fill="#1a222c" stroke="#2b3645"/><text x="196" y="305" font-size="13" class="mono t">1</text>

    <text x="16" y="338" font-size="11" class="m">Cost <tspan class="mono t">20 crumbs</tspan>   ·   Max payout <tspan class="mono t">100 crumbs</tspan></text>
    <rect x="16" y="350" width="328" height="34" rx="6" fill="#2e9c5e"/>
    <text x="180" y="372" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f3fff7">BUY 1 YES @ 20c</text>

    <!-- resting orders -->
    <rect x="16" y="400" width="328" height="104" rx="8" fill="#141c25" stroke="#3a5a86"/>
    <text x="30" y="422" font-size="13" font-weight="700" class="t">Resting orders</text>
    <rect x="134" y="409" width="36" height="17" rx="8.5" fill="#2b4f86"/><text x="152" y="421.5" text-anchor="middle" font-size="9" font-weight="700" fill="#cfe2ff">NEW</text>
    <text x="330" y="422" text-anchor="end" font-size="10.5" class="m">1 open</text>
    <path d="M30 432H330" stroke="#243040"/>
    <text x="30" y="454" font-size="12" class="t">Is a hot dog a sandwich?</text>
    <text x="30" y="472" font-size="11" class="g" font-weight="600">BUY YES <tspan class="mono t" font-weight="400">20c</tspan> <tspan class="m" font-weight="400">· 1 left · resting</tspan></text>
    <rect x="270" y="450" width="60" height="26" rx="5" fill="none" stroke="#ef6b6b"/>
    <text x="300" y="467" text-anchor="middle" font-size="11" font-weight="600" class="r">Cancel</text>
    <text x="30" y="494" font-size="10" class="m">Crumbs are play money. Nobody has ever been paid in crumbs.</text>

    <!-- other markets -->
    <text x="16" y="530" class="lbl">More sandwich questions</text>
    <text x="300" y="530" text-anchor="end" class="lbl">Bid</text>
    <text x="344" y="530" text-anchor="end" class="lbl">Ask</text>
    <path d="M16 536H344" stroke="#243040"/>
    <g font-size="12">
      <text x="16" y="556" class="t">Is a taco a sandwich?</text>
      <text x="300" y="556" text-anchor="end" class="mono g">34c</text><text x="344" y="556" text-anchor="end" class="mono r">36c</text>
      <path d="M16 564H344" stroke="#1c2633"/>
      <text x="16" y="584" class="t">Is cereal a soup?</text>
      <text x="300" y="584" text-anchor="end" class="mono g">12c</text><text x="344" y="584" text-anchor="end" class="mono r">15c</text>
      <path d="M16 592H344" stroke="#1c2633"/>
      <text x="16" y="612" class="t">Does a wrap count?</text>
      <text x="300" y="612" text-anchor="end" class="mono g">48c</text><text x="344" y="612" text-anchor="end" class="mono r">50c</text>
    </g>
  </g>
</svg>
