<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" width="360" height="600" role="img" aria-labelledby="title desc">
  <title id="title">A mobile mock of the T3 Code Crumb Exchange Chief of Staff thread receiving a message sent by another agent</title>
  <desc id="desc">A dark phone-sized view. The header names the crumb-exchange project and the Crumb Exchange CoS thread, marked Working 34s. Below are a changed files summary, an incoming instruction labeled Sent by another agent, a working line, and a composer showing Claude Opus 5.5 with full access.</desc>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .t { fill: #e6e6ea; }
    .m { fill: #8b8b94; }
    .add { fill: #4fc47a; }
    .del { fill: #e0596a; }
    .blue { fill: #5b9bf0; }
    .body { font-size: 13px; fill: #e6e6ea; }
  </style>
  <defs>
    <clipPath id="frame"><rect width="360" height="600" rx="16"/></clipPath>
  </defs>
  <rect width="360" height="600" rx="16" fill="#0d0d11"/>
  <g clip-path="url(#frame)" class="ui">
    <!-- header -->
    <rect width="360" height="58" fill="#121217"/>
    <path d="M0 58H360" stroke="#24242c"/>
    <path d="M16 22h14M16 28h14M16 34h14" stroke="#9a9aa6" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="42" y="14" width="16" height="14" rx="3" fill="#2e3a55"/>
    <text x="50" y="24.5" text-anchor="middle" font-size="8" font-weight="700" fill="#9fc0ff">CE</text>
    <text x="64" y="25" font-size="11" class="m mono">crumb-exchange</text>
    <text x="42" y="46" font-size="14" font-weight="600" class="t">Crumb Exchange CoS</text>
    <circle cx="268" cy="41" r="4.5" fill="none" stroke="#5b9bf0" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="344" y="45" text-anchor="end" font-size="11.5" class="blue">Working 34s</text>

    <!-- changed files -->
    <rect x="16" y="72" width="328" height="92" rx="10" fill="#15151b" stroke="#24242c"/>
    <text x="30" y="94" font-size="12" class="t">6 changed files <tspan class="add mono">+412</tspan> <tspan class="del mono">-37</tspan></text>
    <text x="330" y="94" text-anchor="end" font-size="11" class="m">Open diff</text>
    <g class="mono" font-size="11.5">
      <text x="32" y="118" class="m">▸ ▭ src</text>
      <text x="302" y="118" text-anchor="end" class="add">+296</text>
      <text x="330" y="118" text-anchor="end" class="del">-31</text>
      <text x="32" y="136" class="m">▸ ▭ test</text>
      <text x="302" y="136" text-anchor="end" class="add">+104</text>
      <text x="330" y="136" text-anchor="end" class="del">-6</text>
      <text x="32" y="154" class="m">   ▤ README.md</text>
      <text x="302" y="154" text-anchor="end" class="add">+12</text>
      <text x="330" y="154" text-anchor="end" class="del">-0</text>
    </g>

    <!-- incoming message -->
    <text x="344" y="190" text-anchor="end" font-size="11" class="m">Sent by another agent</text>
    <rect x="16" y="198" width="328" height="150" rx="12" fill="#1e1e26"/>
    <text x="32" y="222" class="body">Add a resting orders panel to Crumb</text>
    <text x="32" y="241" class="body">Exchange: list open orders, let the</text>
    <text x="32" y="260" class="body">user cancel one, and keep the existing</text>
    <text x="32" y="279" class="body">order ticket as it is. Have Fable</text>
    <text x="32" y="298" class="body">review the change before you report</text>
    <text x="32" y="317" class="body">back here with a short summary.</text>
    <text x="330" y="338" text-anchor="end" font-size="11" class="m">Show full message</text>

    <!-- working + thought -->
    <text x="16" y="380" font-size="13" class="m">Working for 34s</text>
    <circle cx="23" cy="404" r="5" fill="none" stroke="#6a6a76" stroke-width="1.3"/>
    <path d="M20 404h6M23 401v6" stroke="#6a6a76" stroke-width="1"/>
    <text x="36" y="408" font-size="12" class="m">Opus has the panel; handing it to Fable…</text>

    <!-- composer -->
    <rect x="16" y="436" width="328" height="112" rx="12" fill="#15151b" stroke="#2a2a35"/>
    <path d="M30 450v12" stroke="#c9c9d0" stroke-width="1.2"/>
    <text x="34" y="460" font-size="12" class="m">Ask anything, @tag files, / for commands</text>
    <path d="M36 501l1.6 3.9 3.9 1.6-3.9 1.6-1.6 3.9-1.6-3.9-3.9-1.6 3.9-1.6z" fill="#e07a55"/>
    <text x="47" y="511" font-size="12" class="t">Claude Opus 5.5 <tspan class="m">⌄</tspan></text>
    <path d="M164 498v18" stroke="#2a2a35"/>
    <rect x="174" y="505" width="8" height="6" rx="1" fill="none" stroke="#c9c9d0" stroke-width="1.2"/>
    <path d="M175.5 505v-2a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="#c9c9d0" stroke-width="1.2"/>
    <text x="188" y="511" font-size="12" class="t">Full access <tspan class="m">⌄</tspan></text>
    <path d="M300 503l-6 6a3 3 0 0 0 4 4l7-7a5 5 0 0 0-7-7l-7 7" fill="none" stroke="#8b8b94" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="324" cy="507" r="12" fill="#e0596a"/>
    <rect x="319.5" y="502.5" width="9" height="9" rx="1.5" fill="#fff"/>
    <text x="180" y="540" text-anchor="middle" font-size="10.5" class="m">Mac mini · crumb-exchange · main</text>

    <!-- bottom bar -->
    <path d="M0 564H360" stroke="#24242c"/>
    <g fill="none" stroke="#6a6a76" stroke-width="1.4" stroke-linecap="round">
      <circle cx="60" cy="582" r="4.5"/>
      <circle cx="140" cy="578" r="2.5"/><circle cx="140" cy="587" r="2.5"/><circle cx="149" cy="578" r="2.5"/><path d="M140 580.5v4M149 580.5c0 4-9 2-9 6"/>
      <path d="M216 587v-6M222 587v-10M228 587v-4"/>
      <path d="M296 578l3 4-3 4M304 578l-3 4 3 4"/>
    </g>
  </g>
</svg>
