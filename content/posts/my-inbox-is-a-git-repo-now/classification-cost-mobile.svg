  <style>text{font-family:system-ui,sans-serif;fill:#eaf0f7}.name{font-size:16px;font-weight:550}.value{font-size:18px;font-weight:650}.muted{font-size:14px;fill:#b6c6d8}</style>
  <rect width="320" height="350" rx="10" fill="#101b28"/>
  <text x="18" y="34" font-size="20" font-weight="650">Less spent sorting email</text>
  <text x="18" y="60" class="muted">USD per 1,000 messages</text>
