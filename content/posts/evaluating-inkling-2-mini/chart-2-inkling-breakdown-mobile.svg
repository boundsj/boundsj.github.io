<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 1602" width="736" height="1602" role="img" aria-labelledby="title desc">
  <title id="title">Inkling 2 Mini passes by task group</title>
  <desc id="desc">Inkling passes and median time. Low 15 of 20 in 6m 55s, medium 15 of 20 in 14m 29s, high 18 of 20 in 29m 10s.</desc>
  <style>
    svg {
      --surface: #fbf9f2;
      --text: #14130f;
      --muted: #65625a;
      --inkling: #075a65;
      --hosted: #3a382f;
      --track: #e7e3d6;
      --rule: #65625a;
      font-family: system-ui, sans-serif;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      fill: var(--text);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface: #13141f;
        --text: #ece7da;
        --muted: #bdbbcd;
        --inkling: #7cc8d4;
        --hosted: #bdbbcd;
        --track: #272a3f;
        --rule: #7f88c4;
      }
    }
    .background { fill: var(--surface); }
    .title { font-size: 23px; font-weight: 700; }
    .heading, .value { font-weight: 700; }
    .note { font-size: 14px; fill: var(--muted); }
    .inkling { fill: var(--inkling); }
    .hosted { fill: var(--hosted); }
    .track, .missed { fill: var(--track); }
    .missed, .axis { stroke: var(--rule); }
    .axis { fill: none; }
  </style>
