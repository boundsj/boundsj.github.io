<title id="t">Summary: Botons customization</title>
<desc id="d">Summary diagram. Me: I set up each Boton, its brain, role, tools and workflow. A round, button-shaped Boton is wired to four setup rows: one, brain or model, Claude Code, Codex or an API key; two, role and instructions, a role in my own words; three, tools, only connectors I give it; four, workflow, skills, routines and Ask first.</desc>
