{{- /* Keep local previews out of analytics; use the existing site configuration. */ -}}
{{- if and hugo.IsProduction .Site.Params.analytics.enable -}}
  {{- with .Site.Params.analytics.google.id }}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', {{ . }});
</script>
  {{- end -}}
{{- end -}}
