<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
{{ partial "head.html" . }}
{{ partial "google-analytics.html" . }}
</head>
<body class="scanlines" data-kind="{{ partial "kind.html" . }}" data-content-group="{{ partial "content-group.html" . }}">
  <a class="kc-skip" href="#main">[ skip to content ]</a>
  {{ partial "header.html" . }}
  <main id="main" class="kc-main" tabindex="-1">
    <div class="kc-shell">
      {{ block "main" . }}{{ end }}
    </div>
  </main>
  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
